# Builds the Coglet ESP32-S3 firmware and publishes it:
#   * GitHub Pages: the web flasher (CogletESP/tools/web_flasher) + firmware parts
#     of every edition (standard -> firmware/, Christmas -> firmware-christmas/,
#     Elf -> firmware-elf/, Snowman -> firmware-snowman/)
#   * GitHub Release: a zip of the parts (on version tags only)
#
# Runs on version tags (v1.2.3) and can be started by hand from the Actions tab.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Firmware

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write     # create the release
  pages: write        # deploy GitHub Pages
  id-token: write     # required by deploy-pages

concurrency:
  group: firmware-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@v4

      # The firmware's own version (what the web flasher reads back): the tag
      # without "v" (v2.3.0 -> 2.3.0), else the default in CogletESP/CMakeLists.txt.
      # Only plain numbers with an optional -suffix: the OTA check parses it.
      - name: Firmware version
        shell: bash
        run: |
          BUILD_ARGS="-D COGLET_BUILD_COMMIT=${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+)?$ ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} is not like v2.3.0 or v2.4.0-beta1"
              exit 1
            fi
            BUILD_ARGS="${BUILD_ARGS} -D PROJECT_VER=${GITHUB_REF_NAME#v}"
          fi
          echo "BUILD_ARGS=${BUILD_ARGS}" >> "$GITHUB_ENV"

      - name: Build firmware (standard edition)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          cd CogletESP
          idf.py ${BUILD_ARGS} build

      - name: Build firmware (Christmas edition)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd CogletESP
          idf.py ${BUILD_ARGS} -B build-christmas -D SDKCONFIG=build-christmas/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="sdkconfig;sdkconfig.christmas" build

      - name: Build firmware (Elf edition)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd CogletESP
          idf.py ${BUILD_ARGS} -B build-elf -D SDKCONFIG=build-elf/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="sdkconfig;sdkconfig.elf" build

      - name: Build firmware (Snowman edition)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd CogletESP
          idf.py ${BUILD_ARGS} -B build-snowman -D SDKCONFIG=build-snowman/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="sdkconfig;sdkconfig.snowman" build

      - name: Collect parts, manifest and web page
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="dev-${GITHUB_SHA::7}"; fi
          python CogletESP/tools/web_flasher/make_manifest.py \
            --build CogletESP/build --site site --release-dir release \
            --version "$VERSION" --commit "${GITHUB_SHA::7}" --repo "${GITHUB_REPOSITORY}"
          python CogletESP/tools/web_flasher/make_manifest.py \
            --build CogletESP/build-christmas --site site --release-dir release --edition christmas \
            --version "$VERSION" --commit "${GITHUB_SHA::7}" --repo "${GITHUB_REPOSITORY}"
          python CogletESP/tools/web_flasher/make_manifest.py \
            --build CogletESP/build-elf --site site --release-dir release --edition elf \
            --version "$VERSION" --commit "${GITHUB_SHA::7}" --repo "${GITHUB_REPOSITORY}"
          python CogletESP/tools/web_flasher/make_manifest.py \
            --build CogletESP/build-snowman --site site --release-dir release --edition snowman \
            --version "$VERSION" --commit "${GITHUB_SHA::7}" --repo "${GITHUB_REPOSITORY}"
          python CogletESP/tools/rp2040_bundle/build_bundle.py \
            --src CogletESP/RP2040 --site site/rp2040
          cp CogletESP/tools/web_flasher/index.html CogletESP/tools/web_flasher/coglet_songs.js CogletESP/tools/web_flasher/coglet_i18n.js site/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
